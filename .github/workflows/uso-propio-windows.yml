# Uso propio (not for upstream): builds the Windows x64 app on every push to the `uso-propio`
# branch, unsigned, with upstream's own packaging script (packaging/windows/package.ps1, as in
# release.yml's windows job without SignPath). The files are kept as a workflow artifact.
name: uso-propio windows

on:
  push:
    branches: [uso-propio]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uso-propio-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: uso-propio-windows-x64
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build and package (msi, portable zip, exe)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Keep the files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solidcraft-windows-x64-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
